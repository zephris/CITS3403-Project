<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register - Monopoly Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5" style="max-width: 500px;">
        <h2 class="mb-4">Register</h2>



        <form action="{{ url_for('register') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input name="username" type="text" class="form-control" maxlength="15" pattern="[A-Za-z0-9]+" required>
                <div class="form-text">
                    Letters and numbers only. Maximum 15 characters.
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input name="password" type="password" class="form-control" minlength="7" maxlength="10"
                    pattern="[0-9]+" required>
                <div class="form-text">
                    Numbers only. 7 to 10 digits.
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100">Create Account</button>
        </form>

        <p class="mt-3">
            Already have an account?
            <a href="{{ url_for('login') }}">Login here</a>
        </p>

        <a href="{{ url_for('home') }}">Back to Home</a>
    </div>
    {% if error %}
    <div class="modal fade" id="registerErrorModal" tabindex="-1" aria-labelledby="registerErrorModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg border-0 rounded-4">
                <div class="modal-header bg-warning text-dark rounded-top-4">
                    <h5 class="modal-title fw-bold" id="registerErrorModalLabel">
                        ⚠️ Registration Error
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <p class="mb-2">
                        {{ error }}
                    </p>
                    <p class="text-muted small mb-0">
                        Please check the username and password rules, then try again.
                    </p>
                </div>

                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-primary px-4" data-bs-dismiss="modal">
                        OK
                    </button>
                </div>
            </div>
        </div>
    </div>
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% if error %}
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const registerErrorModal = new bootstrap.Modal(document.getElementById("registerErrorModal"));
            registerErrorModal.show();
        });
    </script>
    {% endif %}

</body>

</html>
